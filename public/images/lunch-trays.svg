<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgTray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3040"/>
      <stop offset="1" stop-color="#14171f"/>
    </linearGradient>
  </defs>
  <rect width="640" height="340" fill="url(#bgTray)"/>
  <ellipse cx="320" cy="296" rx="220" ry="24" fill="#0a0c11" opacity=".42"/>
  <!-- bottom tray -->
  <rect x="132" y="232" width="376" height="46" rx="12" fill="#8e97a8"/>
  <rect x="132" y="232" width="376" height="16" rx="8" fill="#aab3c2"/>
  <!-- middle tray -->
  <rect x="150" y="180" width="340" height="46" rx="12" fill="#7d8697"/>
  <rect x="150" y="180" width="340" height="16" rx="8" fill="#9ba4b3"/>
  <!-- top tray with lid -->
  <rect x="168" y="128" width="304" height="46" rx="12" fill="#8e97a8"/>
  <rect x="168" y="128" width="304" height="16" rx="8" fill="#aab3c2"/>
  <path d="M180 128q140-58 280 0z" fill="#c8d0dc" opacity=".55"/>
  <path d="M180 128q140-58 280 0" stroke="#dbe2ec" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- food visible in open middle tray -->
  <rect x="176" y="192" width="88" height="22" rx="10" fill="#e0a463"/>
  <rect x="278" y="192" width="76" height="22" rx="10" fill="#5cc47e"/>
  <rect x="368" y="192" width="94" height="22" rx="10" fill="#d5722f"/>
  <!-- steam -->
  <path d="M286 108q-14-22 0-40M320 100q-14-24 0-44M354 108q-14-22 0-40" stroke="#dbe2ec" stroke-width="6" fill="none" stroke-linecap="round" opacity=".4"/>
  <!-- side latches -->
  <rect x="120" y="244" width="18" height="22" rx="6" fill="#68717f"/>
  <rect x="502" y="244" width="18" height="22" rx="6" fill="#68717f"/>
</svg>
