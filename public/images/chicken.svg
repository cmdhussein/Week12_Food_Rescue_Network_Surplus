  <rect x="352" y="140" width="112" height="44" rx="10" fill="#eef3f8"/>
  <rect x="366" y="154" width="60" height="7" rx="3.5" fill="#7f938b"/>
  <rect x="366" y="168" width="42" height="7" rx="3.5" fill="#b0bcc7"/>
  <circle cx="444" cy="162" r="10" fill="#34d399"/>
  <!-- frost -->
  <circle cx="546" cy="196" r="6" fill="#9fd8ee" opacity=".5"/>
  <circle cx="96" cy="220" r="5" fill="#9fd8ee" opacity=".4"/>
  <circle cx="566" cy="248" r="4" fill="#9fd8ee" opacity=".35"/>
</svg>
