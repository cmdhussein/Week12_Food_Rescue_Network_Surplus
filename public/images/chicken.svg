  </defs>
  <rect width="640" height="340" fill="url(#bgChicken)"/>
  <ellipse cx="320" cy="294" rx="214" ry="24" fill="#0a070c" opacity=".42"/>
  <!-- back wrapped pack -->
  <rect x="118" y="126" width="196" height="130" rx="18" fill="#cfd8e2" opacity=".5"/>
  <rect x="132" y="152" width="168" height="88" rx="14" fill="#e6a394"/>
  <ellipse cx="186" cy="196" rx="34" ry="26" fill="#f0b8ab"/>
  <ellipse cx="252" cy="200" rx="30" ry="24" fill="#f0b8ab"/>
  <path d="M118 126q98 22 196 0" stroke="#eef3f8" stroke-width="6" fill="none" opacity=".65"/>
  <path d="M118 256q98-22 196 0" stroke="#eef3f8" stroke-width="6" fill="none" opacity=".45"/>
  <!-- front wrapped pack -->
  <rect x="288" y="164" width="228" height="132" rx="18" fill="#dbe3ec" opacity=".55"/>
  <rect x="304" y="190" width="196" height="90" rx="14" fill="#dd9384"/>
