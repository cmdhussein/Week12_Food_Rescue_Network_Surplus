<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgChicken" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2130"/>
      <stop offset="1" stop-color="#140f17"/>
